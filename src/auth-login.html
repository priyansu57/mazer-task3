{% set title = 'Register' %}
{% extends 'src/layouts/auth.html' %}

{% block content %}
<div class="login-container">
    <!-- Left Illustration -->
    <div class="login-left"></div>

    <!-- Right Form -->
    <div class="login-right">
        <div class="auth-logo">
                <a  href="index.html"><img src="assets/static/images/logo/logo.svg" class="text-center" height="120px" width="120px" alt="Logo"></a>
        </div>
        <h1>Create Account</h1>
        <p class="text-muted mb-4">Fill in your details to register on our platform.</p>

        <form action="/register" method="POST">
            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" placeholder="Email" required>
            </div>

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" placeholder="Username" required>
            </div>

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" placeholder="Password" required>
            </div>

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn btn-custom">Sign Up</button>
        </form>

        <div class="mt-3 text-center">
            <p class="text-muted mb-0">
                Already have an account?
                <a href="/login" class="fw-bold text-decoration-none">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
