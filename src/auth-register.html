{% set title = 'Register' %}

{% extends 'src/layouts/auth.html' %}

{% block content %}
<div class="row g-0 vh-100">
    <!-- Left side: Form -->
    <div class="col-lg-6 col-12 d-flex align-items-center justify-content-center bg-white">
        <div id="auth-left" class="w-75">
            <div class="auth-logo text-center mb-4">
                <a href="index.html">
                    <img src="assets/static/images/logo/logo.svg" alt="Logo" class="img-fluid" style="max-width: 120px;">
                </a>
            </div>
            <h1 class="auth-title text-center mb-2">Create Account</h1>
            <p class="auth-subtitle text-center mb-5 text-muted">Fill in your details to register on our platform.</p>

             <form action="index.html">
                <div class="form-group position-relative has-icon-left mb-4">
                    <input type="text" class="form-control form-control-xl" placeholder="Email">
                    <div class="form-control-icon">
                        <i class="bi bi-envelope"></i>
                    </div>
                </div>
                <div class="form-group position-relative has-icon-left mb-4">
                    <input type="text" class="form-control form-control-xl" placeholder="Username">
                    <div class="form-control-icon">
                        <i class="bi bi-person"></i>
                    </div>
                </div>
                <div class="form-group position-relative has-icon-left mb-4">
                    <input type="password" class="form-control form-control-xl" placeholder="Password">
                    <div class="form-control-icon">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                </div>
                <div class="form-group position-relative has-icon-left mb-4">
                    <input type="password" class="form-control form-control-xl" placeholder="Confirm Password">
                    <div class="form-control-icon">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                </div>
                <button class="btn btn-primary btn-block btn-lg shadow-lg mt-5">Sign Up</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">Already have an account? 
                    <a href="auth-login.html" class="fw-bold text-decoration-none">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-white  ">
        <div class="text-center">
            <h2 class="fw-bold">Welcome to Mazer</h2>
            <p class="lead mt-3">
                Manage everything faster, smarter, and better with our platform.
            </p>
            <img src="assets/static/images/banner/auth-siginup-banner.png" alt="Sign Up" class="img-fluid mb-4" style="max-height: 80%; object-fit: contain;">
            
        </div>
    </div>
</div>

{% endblock %}
